[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/mockup"
  to = "/mockups/cra-homepage-pike-inspired.html"
  status = 200

[[redirects]]
  from = "/leads"
  to = "/leads.html"
  status = 200

# "Bid My Job" — QR intake for subs & vendors, and the internal library.
[[redirects]]
  from = "/bid"
  to = "/bid.html"
  status = 200

[[redirects]]
  from = "/subs"
  to = "/subs.html"
  status = 200

[[redirects]]
  from = "/sign"
  to = "/sign.html"
  status = 200

# The Bid Board — internal, and the vendor's one-tap reply page.
[[redirects]]
  from = "/bids"
  to = "/bids.html"
  status = 200

[[redirects]]
  from = "/bid-invite"
  to = "/bid-invite.html"
  status = 200

# Public, and must stay public — carriers check this URL during A2P review.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
