[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/mockup"
  to = "/mockups/cra-homepage-pike-inspired.html"
  status = 200

[[redirects]]
  from = "/leads"
  to = "/leads.html"
  status = 200
